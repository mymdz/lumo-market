# Global building blocks for the product catalog.
# Templates use {placeholders}: {brand}, {noun}, {gen} (model generation number),
# {model} (model code like "KX450"), {num} (small number), {author},
# or the name of any pool (leaf pools > department pools > global pools).
# Pool values may contain placeholders themselves.

styles:
  tech:
    - "{brand} {tech_line} {gen}{tech_suffix} {noun}"
    - "{brand} {tech_line}{tech_suffix} {noun}"
    - "{brand} {model} {noun}"
  appliance:
    - "{brand} {appl_line} {noun} {model}"
    - "{brand} {noun} {model}"
    - "{brand} {appl_line} {noun}"
  fashion:
    - "{brand} {fit} {material} {noun}"
    - "{brand} {fit} {noun}"
    - "{brand} {collection_f} {material} {noun}"
    - "{brand} {material} {noun}"
  shoes:
    - "{brand} {shoe_line} {noun}"
    - "{brand} {shoe_line} {shoe_mat} {noun}"
    - "{brand} {shoe_mat} {noun}"
  home:
    - "{brand} {home_coll} {noun}"
    - "{brand} {home_coll} {material_home} {noun}"
    - "{brand} {material_home} {noun}"
  furniture:
    - "{brand} {home_coll} {noun}, {material_home}"
    - "{brand} {home_coll} {noun}"
  beauty:
    - "{brand} {beauty_line} {noun}"
    - "{brand} {beauty_ing} {noun}"
  grocery:
    - "{brand} {variety} {noun}"
    - "{brand} {noun}, {variety}"
  generic:
    - "{brand} {noun}"
    - "{brand} {generic_adj} {noun}"
    - "{brand} {generic_adj} {noun} {model}"
  toy:
    - "{brand} {toy_theme} {noun}"
    - "{brand} {noun} {toy_theme}"
  tool:
    - "{brand} {tool_volt} {noun} {model}"
    - "{brand} {noun} {model}"
  book:
    - "{book_title}"
  jewellery:
    - "{brand} {jewel_style} {jewel_mat} {noun}"
    - "{brand} {jewel_mat} {noun}"
  sport:
    - "{brand} {sport_line} {noun}"
    - "{brand} {sport_line} {gen} {noun}"
  auto:
    - "{brand} {noun} {model}"
    - "{brand} {auto_line} {noun}"

